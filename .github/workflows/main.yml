name: Bicycle

on:
  push:
    branches:
      - main

jobs:
  myDeployment:
    runs-on: ubuntu-latest
    steps:
      - name: Repository
        uses: actions/checkout@v4
      - name: connection
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{secrets.IP}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}

          script: |
            cd /home/ubuntu/6weeks_tizal_MEAN
            git pull origin main
            sudo npm i
            sudo npm run build
            cd dist/
            // sudo npm i pm2 -g
            pm2 restart "Bicycle Frontend" || pm2 start --name "Bicycle Frontend" http-server -- /home/ubuntu/6weeks_tizal_MEAN/dist -p 4200 -d false
