name: Bicycle

on:
  push:
    branches:
      - main

jobs:
  myDeployment:
    runs-on: ubuntu-latest
    steps:
      - name: Repository
        uses: actions/checkout@v4
      - name: connection
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{secrets.IP}}
          username: ${{secrets.USERNAME}}
          password: ${{secrets.PASSWORD}}

          script: |
            cd /home/karan/frontendBicycle/
            git pull origin main
            sudo npm i
            npm run build
            cd dist/bicycle/
            sudo npm i pm2 -g
            pm2 start --name "Bicycle Frontend" /home/karan/.nvm/versions/node/v24.18.0/bin/http-server -- -p 4200 -d false
